bind-key C-a last-window
bind-key a send-prefix
set -sa terminal-overrides ",*256*:Tc"
set -g allow-passthrough on

# code-server / VS Code inside tmux needs these to reach the current window.
set-option -ga update-environment ' VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN VSCODE_IPC_HOOK_CLI GIT_ASKPASS NODE_OPTIONS VSCODE_INSPECTOR_OPTIONS'
