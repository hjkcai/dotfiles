# Nord, mapped from ~/.config/opencode/themes/my-nord.json (dark).
# Polar Night / Snow Storm / Frost / Aurora. Yellow is not a hue in that
# theme, so warning and search use the warm emphasis color (#d08770).
base = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg = "#22262f"
toc_border = "#434c5e"
content_bg = "#2e3440"
scrollbar_hover = "#88c0d0"
status_bg = "#2e3440"
status_separator = "#4c566a"
status_brand_fg = "#2e3440"
status_brand_bg = "#88c0d0"
status_filename_fg = "#eceff4"
status_filename_bg = "#3b4252"
status_watch_fg = "#a3be8c"
status_watch_bg = "#313f24"
status_reloaded_fg = "#2e3440"
status_reloaded_bg = "#a3be8c"
status_search_fg = "#d08770"
status_search_bg = "#3b4252"
status_success_fg = "#a3be8c"
status_success_bg = "#313f24"
status_warning_fg = "#d08770"
status_error_fg = "#bf616a"
status_error_bg = "#4e1b21"
status_shortcut_fg = "#8b95a7"
status_percent_fg = "#88c0d0"
toc_hover_fg = "#eceff4"
toc_header_fg = "#8b95a7"
toc_active_bg = "#3b4252"
toc_inactive_bg = "#22262f"
